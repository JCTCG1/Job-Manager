<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TCG Daily Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #14161b;
    --row: #1d2026;
    --row-line: #2f343d;
    --ink: #f4f5f7;
    --ink-dim: #9aa1ac;
    --ink-faint: #6b7280;
    --amber: #ffb01f;
    --card: #ffffff;
    --card-ink: #14171c;
    --card-line: #e4e7ec;
    --green: #34c759;
    --blue: #3b82f6;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .label {
    font-family: 'Barlow Semi Condensed', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── Header ── */
  .board-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 26px;
    border-bottom: 1px solid var(--row-line);
    flex-wrap: wrap;
  }
  .board-head .title {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 24px;
  }
  .board-head .title span { color: var(--amber); }
  .board-head .right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .board-head .date { color: var(--ink-dim); font-size: 14px; }
  .sync { display: flex; align-items: center; gap: 7px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); transition: background .3s; }
  .sync-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sync-dot.error { background: #e07060; }
  .sync-label { color: var(--ink-dim); font-size: 13px; }
  .board-head button {
    font-family: 'Barlow Semi Condensed', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    font-size: 13px;
    background: var(--row);
    color: var(--ink);
    border: 1px solid var(--row-line);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .board-head button:hover { border-color: var(--amber); color: var(--amber); }

  /* ── Board ── */
  .board { padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; max-width: 1700px; margin: 0 auto; }

  .job {
    background: var(--row);
    border: 1px solid var(--row-line);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .5s ease;
  }
  .job.just-updated { border-color: var(--amber); }

  .job-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--row-line);
  }
  .job-head .num {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--amber);
    min-width: 100px;
    white-space: nowrap;
  }
  .job-head .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .job-head .cust {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.02em;
  }
  .job-head .cust.placeholder { color: var(--ink-faint); font-weight: 500; }
  .job-head .unit { color: var(--ink-dim); font-size: 14px; }
  .job-head .right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .job-head .tech { color: var(--ink-dim); font-size: 14px; }
  .job-head .tech b { color: var(--ink); font-weight: 600; }
  .status { font-size: 13px; padding: 5px 12px; border-radius: 30px; font-weight: 600; }
  .status.shop  { background: rgba(52,199,89,.15);  color: var(--green); border: 1px solid rgba(52,199,89,.4); }
  .status.sched { background: rgba(59,130,246,.15); color: var(--blue);  border: 1px solid rgba(59,130,246,.4); }
  .status.parts { background: rgba(255,176,31,.15); color: var(--amber); border: 1px solid rgba(255,176,31,.4); }
  .status.neutral { background: rgba(154,161,172,.14); color: var(--ink-dim); border: 1px solid rgba(154,161,172,.3); }

  .tasks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    padding: 14px 18px 16px;
  }
  .task {
    background: var(--card);
    color: var(--card-ink);
    border-radius: 8px;
    border: 1px solid var(--card-line);
    overflow: hidden;
    cursor: pointer;
    transition: opacity .2s ease;
    user-select: none;
  }
  .task .cat {
    background: var(--card-ink);
    color: #fff;
    font-family: 'Barlow Semi Condensed', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
    font-size: 13px;
    padding: 7px 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .task .cat .auto { font-size: 9px; background: var(--amber); color: #1a1205; padding: 1px 6px; border-radius: 20px; }
  .task .steps { padding: 9px 11px; font-size: 13.5px; line-height: 1.45; }
  .task.complete { opacity: .5; }
  .task.complete .cat { background: var(--green); }

  .empty {
    padding: 26px 14px;
    text-align: center;
    color: var(--ink-faint);
  }
  .empty .big {
    font-family: 'Barlow Semi Condensed', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    font-size: 15px;
    margin-bottom: 4px;
  }
  .empty .sub { font-size: 13px; }

  @media print {
    body { background: #fff; color: #111; padding: 10px; }
    .board-head { border-color: #ccc; }
    .board-head .title, .board-head .date, .sync-label { color: #111; }
    .board-head button, .sync-dot { display: none; }
    .job { background: #fff; border-color: #bbb; break-inside: avoid; }
    .job-head { border-color: #ddd; }
    .job-head .cust, .job-head .unit, .job-head .tech { color: #111; }
    .task { border-color: #bbb; }
    .task.complete { opacity: .55; }
    @page { size: landscape; margin: 0.35in; }
  }
  @media (max-width: 720px) {
    .job-head { flex-wrap: wrap; }
    .job-head .num { min-width: auto; }
    .job-head .right { margin-left: 0; width: 100%; }
    .tasks { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="board-head">
  <div class="title">TCG <span>//</span> Daily Jobs</div>
  <div class="right">
    <div class="date" id="date-display"></div>
    <div class="sync"><span class="sync-dot" id="sync-dot"></span><span class="sync-label" id="sync-label">connecting…</span></div>
    <button onclick="window.print()">Print</button>
  </div>
</div>

<div class="board" id="board"></div>

<!-- ============================================================
     DATA CONTRACT (shared with the invoice parser)
     ------------------------------------------------------------
     jobs/slot{1-4} = {
       customer: string,
       vehicle:  string,
       tech:     string,
       status:   string   (optional: "In Shop" | "Awaiting Parts" |
                            "Scheduled" | etc. — drives the badge color)
       tasks: [
         { category: string, steps: string, dynamic?: boolean }
       ]
     }

     done/slot{1-4} = { "<taskIndex>": true }   // task marked complete

     Backward compatible: if a slot has the OLD shape
     (categories -> subs -> items) instead of `tasks`, the board
     flattens each category into a single comma-joined task line.
     ============================================================ -->

<script type="module">
import { initializeApp }                           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCJpAsk_zRsssznO0_c2QxSpB7BJykULKY",
  authDomain:        "tcg-jobs.firebaseapp.com",
  databaseURL:       "https://tcg-jobs-default-rtdb.firebaseio.com",
  projectId:         "tcg-jobs",
  storageBucket:     "tcg-jobs.firebasestorage.app",
  messagingSenderId: "275203550533",
  appId:             "1:275203550533:web:bf497f86eee41a7048622c"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const doneListeners = {};

function setSyncStatus(ok) {
  document.getElementById('sync-dot').className     = 'sync-dot ' + (ok ? 'live' : 'error');
  document.getElementById('sync-label').textContent = ok ? 'live' : 'disconnected';
}

onValue(ref(db, 'jobs'), (snapshot) => {
  const data = snapshot.val() || {};
  setSyncStatus(true);
  for (let i = 1; i <= 4; i++) {
    if (data[`slot${i}`]) window.applyJobToSlot(i, data[`slot${i}`]);
    else                  window.clearSlotDisplay(i);
  }
}, () => setSyncStatus(false));

/* live per-slot completion state */
window.setupDoneListener = function(slotNum) {
  if (doneListeners[slotNum]) doneListeners[slotNum]();
  doneListeners[slotNum] = onValue(ref(db, `done/slot${slotNum}`), (snap) => {
    const data = snap.val() || {};
    const container = document.getElementById(`tasks-${slotNum}`);
    if (!container) return;
    container.querySelectorAll('.task[data-task-index]').forEach(t => {
      t.classList.toggle('complete', !!data[t.dataset.taskIndex]);
    });
  });
};

window.setDoneInDB = function(slotNum, taskIndex, done) {
  const path = `done/slot${slotNum}/${taskIndex}`;
  if (done) set(ref(db, path), true);
  else      remove(ref(db, path));
};
</script>

<script>
document.getElementById('date-display').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

function statusClass(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('shop'))                       return 'shop';
  if (s.includes('part'))                       return 'parts';
  if (s.includes('schedul'))                    return 'sched';
  if (!s)                                        return '';
  return 'neutral';
}

/* Resolve the task list for a slot, supporting both new and old shapes */
function resolveTasks(jobData) {
  if (Array.isArray(jobData.tasks)) return jobData.tasks;
  if (Array.isArray(jobData.categories)) {
    return jobData.categories.map(c => ({
      category: c.cat || c.category || 'Task',
      steps: (c.subs || [])
        .flatMap(s => s.items || [])
        .filter(Boolean)
        .join(', ')
    }));
  }
  return [];
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let i = 1; i <= 4; i++) {
    const job = document.createElement('div');
    job.className = 'job';
    job.id = `job-${i}`;
    job.innerHTML = `
      <div class="job-head">
        <div class="num">Job ${i}</div>
        <div class="who">
          <div class="cust placeholder" id="cust-${i}">Open</div>
          <div class="unit" id="unit-${i}"></div>
        </div>
        <div class="right">
          <div class="tech" id="tech-${i}"></div>
          <div class="status" id="status-${i}" style="display:none"></div>
        </div>
      </div>
      <div class="tasks" id="tasks-${i}"></div>
    `;
    board.appendChild(job);
    clearSlotDisplay(i);
  }
}

window.applyJobToSlot = function(slotNum, jobData) {
  const job = document.getElementById(`job-${slotNum}`);
  if (!job) return;

  const cust = document.getElementById(`cust-${slotNum}`);
  cust.textContent = jobData.customer || 'Open';
  cust.classList.toggle('placeholder', !jobData.customer);

  document.getElementById(`unit-${slotNum}`).textContent = jobData.vehicle || '';

  const tech = document.getElementById(`tech-${slotNum}`);
  tech.innerHTML = jobData.tech ? `Tech · <b>${jobData.tech}</b>` : '';

  const badge = document.getElementById(`status-${slotNum}`);
  if (jobData.status) {
    badge.textContent = jobData.status;
    badge.className = 'status label ' + statusClass(jobData.status);
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }

  const tasks = resolveTasks(jobData);
  const container = document.getElementById(`tasks-${slotNum}`);
  if (!tasks.length) {
    container.innerHTML =
      '<div class="empty"><div class="big">Pending job details</div>' +
      '<div class="sub">Push a job from the invoice parser</div></div>';
  } else {
    container.innerHTML = tasks.map((t, idx) => `
      <div class="task" data-task-index="${idx}">
        <div class="cat">
          <span>${t.category || 'Task'}</span>
          ${t.dynamic ? '<span class="auto">AUTO</span>' : ''}
        </div>
        <div class="steps">${t.steps || ''}</div>
      </div>`).join('');
    container.querySelectorAll('.task').forEach(el => {
      el.addEventListener('click', () => {
        const idx = el.dataset.taskIndex;
        const nowComplete = !el.classList.contains('complete');
        el.classList.toggle('complete', nowComplete);
        if (window.setDoneInDB) window.setDoneInDB(slotNum, idx, nowComplete);
      });
    });
  }

  job.classList.add('just-updated');
  setTimeout(() => job.classList.remove('just-updated'), 2000);
  if (window.setupDoneListener) window.setupDoneListener(slotNum);
};

window.clearSlotDisplay = function(slotNum) {
  const cust = document.getElementById(`cust-${slotNum}`);
  if (cust) { cust.textContent = 'Open'; cust.classList.add('placeholder'); }
  const unit = document.getElementById(`unit-${slotNum}`); if (unit) unit.textContent = '';
  const tech = document.getElementById(`tech-${slotNum}`); if (tech) tech.innerHTML = '';
  const badge = document.getElementById(`status-${slotNum}`); if (badge) badge.style.display = 'none';
  const container = document.getElementById(`tasks-${slotNum}`);
  if (container) {
    container.innerHTML =
      '<div class="empty"><div class="big">Open bay</div>' +
      '<div class="sub">Push a job from the invoice parser</div></div>';
  }
};

renderBoard();
</script>
</body>
</html>
