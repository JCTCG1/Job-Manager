<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Invoice Parser</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1c1c1c;
    --surface:  #252525;
    --card:     #2c2c2c;
    --border:   #3a3a3a;
    --border-l: #484848;
    --teal:     #4a9e8e;
    --orange:   #c8763a;
    --text:     #ede8e0;
    --muted:    #7a756e;
    --light:    #b0a898;
    --cat:      #4a9e8e;
    --subcat:   #a09888;
    --item:     #c0b8a8;
    --accent:   #4a9e8e;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 48px; }

  /* ── Auth gate ── */
  #auth-gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
  .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 48px 40px; text-align: center; max-width: 360px; width: 100%; }
  .auth-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 0.12em; color: var(--text); margin-bottom: 4px; }
  .auth-box h1 span { color: var(--teal); }
  .auth-box p { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px 16px; border: 1px solid var(--border-l); border-radius: 3px; background: var(--card); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500; color: var(--text); transition: border-color 0.15s, background 0.15s; }
  .btn-google:hover { border-color: var(--teal); background: #333; }
  .btn-google svg { flex-shrink: 0; }
  .auth-error { margin-top: 14px; font-family: 'DM Mono', monospace; font-size: 0.68rem; color: #e07060; display: none; }

  #app { display: none; }

  /* ── Header ── */
  header { background: #141414; border-bottom: 1px solid var(--border); padding: 14px 24px; text-align: center; }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.14em; color: var(--text); line-height: 1; }
  header h1 span { color: var(--teal); }
  header .sub { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
  .top-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-l); display: inline-block; transition: background 0.3s; }
  .sync-dot.live { background: var(--teal); box-shadow: 0 0 5px var(--teal); }
  .sync-dot.error { background: #e07060; }
  .sync-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); letter-spacing: 0.04em; }
  .user-info { font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }
  .btn-signout { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; background: none; border: 1px solid var(--border-l); border-radius: 2px; padding: 4px 12px; cursor: pointer; color: var(--muted); }
  .btn-signout:hover { border-color: var(--muted); color: var(--text); }

  /* ── Input panel ── */
  .page-wrap { padding: 24px 20px; max-width: 900px; margin: 0 auto; }
  .input-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 24px; }
  .input-panel h2 { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .fields-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group label { font-family: 'DM Mono', monospace; font-size: 0.6rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  .field-group input { border: 1px solid var(--border-l); border-radius: 2px; padding: 7px 8px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; outline: none; color: var(--text); background: var(--card); transition: border-color 0.15s; }
  .field-group input:focus { border-color: var(--teal); }
  .field-group input::placeholder { color: #4a4a4a; }

  textarea { width: 100%; min-height: 160px; border: 1px solid var(--border-l); border-radius: 2px; padding: 10px; font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text); resize: vertical; outline: none; background: var(--card); line-height: 1.6; transition: border-color 0.15s; }
  textarea:focus { border-color: var(--teal); }
  textarea::placeholder { color: #4a4a4a; }

  .parse-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .btn-primary { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 20px; border-radius: 2px; cursor: pointer; border: 1px solid var(--teal); background: var(--teal); color: #fff; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-secondary { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 16px; border-radius: 2px; cursor: pointer; border: 1px solid var(--border-l); background: transparent; color: var(--light); transition: all 0.15s; }
  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  .btn-green { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 20px; border-radius: 2px; cursor: pointer; border: 1px solid var(--orange); background: var(--orange); color: #fff; transition: opacity 0.15s; }
  .btn-green:hover { opacity: 0.85; }
  .btn-green:disabled { opacity: 0.35; cursor: not-allowed; }

  .status { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.04em; }
  .status.loading { color: var(--light); }
  .status.error   { color: #e07060; }
  .status.done    { color: var(--teal); }

  /* ── Result card ── */
  .result-area { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .result-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.12em; color: var(--muted); }
  .result-actions { display: flex; gap: 8px; }
  .job-card { background: var(--card); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .job-header { background: #222; border-bottom: 1px solid var(--border); padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .job-info-item { display: flex; flex-direction: column; gap: 3px; }
  .job-info-item .label { font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .job-info-item .value { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.06em; color: var(--text); }
  .job-body { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .cat-title { font-family: 'DM Mono', monospace; font-size: 0.62rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--teal); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 8px; }
  .subcategory { margin-bottom: 8px; padding-left: 2px; }
  .sub-title { font-size: 0.68rem; font-weight: 600; color: var(--subcat); margin-bottom: 4px; }
  .items { list-style: none; padding-left: 8px; }
  .items li { display: flex; align-items: flex-start; gap: 5px; font-size: 0.67rem; color: var(--item); line-height: 1.6; padding: 1px 0; }
  .items li::before { content: '–'; color: var(--orange); flex-shrink: 0; }

  .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--border-l); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.06em; border: 1px dashed var(--border-l); border-radius: 3px; }

  /* ── Modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border-l); border-radius: 4px; padding: 24px; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  .modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.12em; color: var(--text); margin-bottom: 16px; }
  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .slot-btn { font-family: 'DM Mono', monospace; font-size: 0.68rem; padding: 10px; border: 1px solid var(--border-l); border-radius: 3px; background: var(--card); cursor: pointer; text-align: left; transition: border-color 0.15s; color: var(--text); }
  .slot-btn:hover { border-color: var(--teal); background: #333; }
  .slot-btn .slot-num { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 0.1em; color: var(--orange); display: block; margin-bottom: 2px; }
  .slot-btn .slot-name { font-size: 0.6rem; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-btn.occupied { border-color: var(--orange); }
  .modal-cancel { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; background: none; border: 1px solid var(--border-l); border-radius: 2px; padding: 6px 14px; cursor: pointer; color: var(--muted); }
  .modal-cancel:hover { border-color: var(--muted); color: var(--text); }

  @media print {
    #auth-gate { display: none !important; }
    body { background: white; padding: 0; margin: 0; color: #111; }
    header { background: white; border-bottom: 1px solid #ccc; padding: 6px 12px; }
    header h1 { color: #111; font-size: 1rem; }
    header h1 span { color: #2a7a6a; }
    .top-bar, .parse-row, .input-panel { display: none !important; }
    .result-actions { display: none; }
    .result-header { display: none; }
    .result-area { padding: 0; margin: 0; max-width: 100%; }
    .job-card { background: white; border: 0.5px solid #ccc; }
    .job-header {
      background: #f5f5f5;
      padding: 6px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }
    .job-info-item .label { font-size: 0.5rem; letter-spacing: 0.08em; color: #888; }
    .job-info-item .value { font-size: 0.7rem; font-family: 'Bebas Neue', sans-serif; color: #111; }
    .job-body {
      padding: 8px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px 10px;
      align-items: start;
    }
    .category { break-inside: avoid; }
    .cat-title {
      font-size: 0.52rem;
      color: #2a7a6a;
      border-bottom-color: #ddd;
      padding-bottom: 2px;
      margin-bottom: 4px;
      letter-spacing: 0.08em;
    }
    .subcategory { margin-bottom: 4px; }
    .sub-title { font-size: 0.58rem; color: #444; margin-bottom: 2px; }
    .items { padding-left: 6px; }
    .items li {
      font-size: 0.55rem;
      line-height: 1.4;
      padding: 0;
      color: #333;
      gap: 3px;
    }
    .items li::before { color: #c8763a; }
    @page { size: landscape; margin: 0.3in; }
  }
</style>
</head>
<body>

<!-- ── Auth gate ── -->
<div id="auth-gate">
  <div class="auth-box">
    <h1>TCG <span>Invoice Parser</span></h1>
    <p>Sign in with your TCG Google account</p>
    <button class="btn-google" id="btn-google-signin">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error">Access denied. Use your TCG email address.</div>
  </div>
</div>

<!-- ── Main app ── -->
<div id="app">
  <header>
    <h1>TCG <span>Invoice Parser</span></h1>
    <div class="sub">Paste a QuickBooks invoice → push to job board</div>
    <div class="top-bar">
      <span class="sync-dot" id="sync-dot"></span>
      <span class="sync-label" id="sync-label">connecting...</span>
      <span class="user-info" id="user-info"></span>
      <button class="btn-signout" id="btn-signout">Sign Out</button>
    </div>
  </header>

  <div class="page-wrap">
    <div class="input-panel">
      <h2>Job Info</h2>
      <div class="fields-row">
        <div class="field-group"><label>Customer Name</label><input id="f-customer" placeholder="e.g. John Smith" autocomplete="off"></div>
        <div class="field-group"><label>Vehicle</label><input id="f-vehicle" placeholder="e.g. 2022 Ford F-250" autocomplete="off"></div>
        <div class="field-group"><label>Tech</label><input id="f-tech" placeholder="Initials" autocomplete="off"></div>
      </div>
      <h2 style="margin-bottom:12px;">Invoice Line Items</h2>
      <textarea id="invoice-input" placeholder="Paste your QuickBooks invoice line items here...

Example:
Victron SmartSolar MPPT 100/30
Battle Born 100Ah LiFePO4 Battery x2
Renogy 200W Solar Panel x2
Victron BMV-712 Battery Monitor
Blue Sea 5029 ST Blade Fuse Block
2/0 AWG Welding Cable - Red 6ft
Install labor - solar system
Roof penetration glands x4
Wire loom and conduit
Shore power inlet install"></textarea>
      <div class="parse-row">
        <button class="btn-primary" id="btn-parse" onclick="parseInvoice()">Generate Job Card</button>
        <button class="btn-secondary" onclick="clearAll()">Clear</button>
        <button class="btn-green" id="btn-push" onclick="openSlotPicker()" disabled>Send to Job Board →</button>
        <span class="status" id="status"></span>
      </div>
    </div>
  </div>

  <div class="result-area">
    <div id="result-empty" class="empty-state">Generated job card will appear here</div>
    <div id="result-wrap" style="display:none;">
      <div class="result-header">
        <h2>Generated Job Card</h2>
        <div class="result-actions"><button class="btn-secondary" onclick="window.print()">Print</button></div>
      </div>
      <div class="job-card">
        <div class="job-header" id="result-header-fields"></div>
        <div class="job-body" id="result-body"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="slot-modal">
  <div class="modal">
    <h3>Send to Job Slot</h3>
    <div class="slot-grid" id="slot-grid"></div>
    <button class="modal-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp }                              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue }             from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged }
                                                      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCJpAsk_zRsssznO0_c2QxSpB7BJykULKY",
  authDomain:        "tcg-jobs.firebaseapp.com",
  databaseURL:       "https://tcg-jobs-default-rtdb.firebaseio.com",
  projectId:         "tcg-jobs",
  storageBucket:     "tcg-jobs.firebasestorage.app",
  messagingSenderId: "275203550533",
  appId:             "1:275203550533:web:bf497f86eee41a7048622c"
};

const ALLOWED_EMAILS = [
  "justin@truckcampergarage.com",
  "ryan@truckcampergarage.com",
  "john@truckcampergarage.com",
  "zach@truckcampergarage.com",
  "sacha@truckcampergarage.com",
  "sam@truckcampergarage.com"
];

const app      = initializeApp(firebaseConfig);
const db       = getDatabase(app);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, (user) => {
  if (user && ALLOWED_EMAILS.includes(user.email)) {
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-info').textContent = user.email;
    document.getElementById('auth-error').style.display = 'none';
    startListening();
  } else if (user) {
    fbSignOut(auth);
    document.getElementById('auth-error').style.display = 'block';
    document.getElementById('auth-gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  } else {
    document.getElementById('auth-gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

document.getElementById('btn-google-signin').addEventListener('click', async () => {
  try { await signInWithPopup(auth, provider); } catch(e) { console.error(e); }
});
document.getElementById('btn-signout').addEventListener('click', () => { fbSignOut(auth); });

const currentSlots = {};

function startListening() {
  onValue(ref(db, 'jobs'), (snapshot) => {
    const data = snapshot.val() || {};
    Object.assign(currentSlots, data);
    for (let i = 1; i <= 4; i++) {
      if (!data[`slot${i}`]) delete currentSlots[`slot${i}`];
    }
    setSyncStatus(true);
  }, () => setSyncStatus(false));
}

function setSyncStatus(ok) {
  document.getElementById('sync-dot').className     = 'sync-dot ' + (ok ? 'live' : 'error');
  document.getElementById('sync-label').textContent = ok ? 'connected to job board' : 'disconnected';
}

window.pushJobToSlot = async function(slotNum, jobData) {
  await set(ref(db, `jobs/slot${slotNum}`), jobData);
};

window._currentSlots = currentSlots;
</script>

<script>
let lastParsed = null;

async function parseInvoice() {
  const invoiceText = document.getElementById('invoice-input').value.trim();
  if (!invoiceText) { setStatus('Paste some invoice line items first.', 'error'); return; }

  const customer = document.getElementById('f-customer').value.trim() || 'N/A';
  const vehicle  = document.getElementById('f-vehicle').value.trim()  || 'N/A';
  const tech     = document.getElementById('f-tech').value.trim()     || 'N/A';

  setStatus('<span class="spinner"></span>Parsing invoice...', 'loading');
  document.getElementById('btn-parse').disabled = true;
  document.getElementById('btn-push').disabled  = true;

  const prompt = `You are a job card generator for Truck Camper Garage (TCG), a truck camper install, service, and custom fab shop in San Diego. Generate a concise job task card from QuickBooks invoice line items.

IMPORTANT: Keep tasks SHORT — 3 to 5 bullet points max per subcategory. Checkpoints only, not full procedures. Every job gets a Final QC section at the end (once only).

Use the REFERENCE GUIDE to assign tasks to recognized items. For anything not in the guide, use the STRICT RULES.

── CAMPER INSTALL / BED PREP ──
(camper unit, bed mat, Scout/Lance/FWC delivery, receiving)
- Lay rubber bed mat — trim to fit
- Load camper, confirm alignment and fit
- Check all anchor points before securing

── TORKLIFT TIE-DOWNS ──
(TorkLift, Talon, frame mount tie downs, ApexAnchors)
- Confirm part number via TorkLift fit guide
- Bolt receiver tubes to frame — front and rear
- Insert tie-down slugs, verify all 4 points secure

── TURNBUCKLES ──
(FastGun, FastGun Apex, SpringLoad XL, turnbuckles)
- Assemble and hang from camper anchor points
- Tension to 300 lbs — confirm O-ring indicator at each corner
- Install locks if included

── STABLELOAD / SUMO SPRINGS ──
(StableLoad, Sumo Springs)
- Confirm fitment for truck make/model
- Install per TorkLift/manufacturer spec
- Test load response after install

── AIR BAGS & COMPRESSOR ──
(Air Lift, air bags, helper springs, WirelessONE, WirelessAIR, compressor)
- Install air bag assemblies at rear axle per Air Lift instructions
- Mount compressor, run air lines — no kinks
- Wire compressor to power, pair remote/Bluetooth
- Inflate to spec, test for leaks

NOTE: TCG does NOT perform suspension lifts, spring swaps, or shock replacements. If any line item references lift kits, springs, or shocks, output it as "Refer to North County Spring — outside TCG scope" under a Referrals category.

── 7-WAY RV CABLE & IN-BED PLUG ──
(7-way, RV cable, in-bed plug, Lance 6-wire, brake light wiring, 3rd brake light)
- Route and secure 7-way cable in bed
- Install in-bed plug/connector — weatherproof
- Connect to truck wiring — verify running lights and brake signal
- Test all circuits

── ALTERNATOR / DC-DC CHARGING ──
(truck charging, DC-DC, Victron Orion, Renogy DC-DC, alternator charging, fast charging)
- Run charge wire from engine bay to camper — fuse at source
- Mount DC-DC charger near house battery
- Configure for LiFePO4 or AGM as needed
- Test: engine on → confirm charge output

── LITHIUM BATTERY ──
(Dakota Lithium, Rich Solar battery, Expion, battle born, LiFePO4, 100Ah/200Ah/320Ah)
- Mount and secure battery — fuse within 18" of positive
- Connect to busbar/fuse block — verify polarity
- Set charger profile to LiFePO4
- Confirm BMS and SOC monitor working

── SOLAR PANELS ──
(Rich Solar panel, solar panel, 200W/250W/300W)
- Place panels — check shading and obstruction
- Mount brackets, secure to roof — butyl tape and sealant at all penetrations
- Run and connect MC4 wiring
- Confirm series/parallel config, secure loom

── MPPT SOLAR CONTROLLER ──
(Victron MPPT, SmartSolar, Rich Solar MPPT, charge controller)
- Mount in ventilated location
- Wire battery first, then PV input — fuse PV
- Set battery profile (LiFePO4: 14.6V absorption, 13.6V float)
- Verify charge current in VictronConnect or app

── ROOF ENTRY GLAND ──
(roof gland, cable entry, roof penetration, cable gland)
- Score membrane, drill to gland spec
- Install gland with butyl tape — sealant over fasteners
- Route cable, leave drip loop at entry point

── INVERTER ──
(inverter, pure sine, Rich Solar Nova, Victron inverter, AIMS)
- Mount near battery — ventilated location
- DC input cables sized and fused within 18" of battery
- Wire AC output to outlets/panel
- Test under load

── TRANSFER SWITCH / SHORE POWER ──
(transfer switch, shore power, auto transfer, 120V circuit)
- Install transfer switch between shore/generator and inverter
- Wire inputs and output — verify auto-switching
- Test shore power, generator, and inverter modes

── FUSE BLOCK / DISTRIBUTION ──
(Blue Sea, fuse block, breaker panel, busbar, distribution)
- Mount in accessible location — label all circuits
- Fuse feed wire from battery
- Test each circuit

── BATTERY MONITOR / SHUNT ──
(Victron BMV, shunt, battery monitor, SmartShunt, GX Touch)
- Install shunt on negative bus
- Wire monitor display
- Configure capacity and charge settings

── WIRING / HARDWARE (generic) ──
(wire, loom, lugs, connectors, sealant, hardware, parts)
- Size wire per load — crimp and heat-shrink all terminations
- Route in loom — secure every 18–24"
- Label circuits at both ends

── STARLINK MINI ──
(Starlink, Starlink Mini, satellite dish, Starlink mount, VHB, mag mount)
- Check obstruction via Starlink app before mounting
- Mount dish — magnet, VHB, or bolt-on
- Route cable through existing gland or new penetration — drip loop at entry
- Connect 12V DC power cable, verify signal

── BACKUP / DASH CAMERA ──
(backup camera, WolfBox, dashcam, rear camera, camera system, mirror camera)
- Mount camera(s) — confirm sightlines
- Route cables — use existing grommets where possible
- Connect to reverse circuit or hardwire kit
- Test all camera views on display

── ROOF RACK / CROSSBARS ──
(roof rack, Yakima, Rhino-Rack, Thule, crossbars, rack)
- Confirm fitment for camper model
- Mount feet — butyl tape, sealant all penetrations
- Torque to spec, verify level and no flex under load

── AWNING ──
(awning, Kammock, 270 awning, crosswing, awning bracket)
- Fabricate/install mounting brackets as needed
- Mount awning to camper — torque hardware
- Test open/close operation, verify clearance

── MAXXAIR / ROOF FAN ──
(Maxxair, roof fan, roof vent, fan install)
- Remove old vent if applicable — clean opening
- Install fan with butyl tape and sealant
- Wire to 12V — test all speeds and open/close

── DIESEL HEATER ──
(diesel heater, Espar, RADICA, heater install, furnace)
- Mount heater and fuel tank — route exhaust to exterior
- Connect fuel line, power, and thermostat/controller
- Prime fuel system, run and verify heat output

── AC UNIT ──
(AC, air conditioner, Nomadic, Furrion, Truma, mini split, rooftop AC)
- Cut/prep roof opening if needed — seal edges
- Install unit, run 120V circuit from shore/inverter panel
- Wire thermostat/controller
- Test cooling and confirm no leaks at penetrations

── TV MOUNT ──
(TV, television, TV mount)
- Confirm backing/stud behind mount location
- Mount bracket, route power and HDMI
- Hang TV, test picture and security

── PLUMBING ──
(plumbing, water pump, tank, faucet, shower, water heater, propane water heater)
- Install/replace components per scope
- Pressure test all connections — no leaks
- Verify pump prime and flow
- Test hot/cold at all fixtures

── PROPANE ──
(propane, MB Sturgis, quick disconnect, propane line, hose)
- Install quick-disconnect or run copper line
- Leak test all fittings with soapy water
- Verify appliance operation

── COMPOSTING TOILET ──
(composting toilet, Cuddy Lite, Trelino, CompoCloset)
- Mount toilet — level and secure
- Install vent fan and route exhaust to exterior if required
- Test operation

── ROOF RACK / SOLAR ARRAY / CUSTOM FAB ──
(aluminum frame, custom fab, aluminum platform, custom bracket, welding)
- Fabricate per scope — confirm dimensions before cutting
- Test fit before final weld/fastening
- Apply sealant at all roof penetrations
- Verify load rating and security

── SUSPENSION SEALANT / ROT REPAIR ──
(rot repair, resealing, epoxy, sealant, pirelli seal, trim repair)
- Remove damaged material — document extent before proceeding
- Treat/inject epoxy or apply sealant per scope
- Allow full cure time before closing up
- Verify water-tight before returning to customer

── REPAIR (general) ──
(repair, troubleshoot, warranty, fix, replace, swap)
- Diagnose root cause before replacing components
- Document findings — note any related issues found
- Repair/replace per scope
- Test repaired system — confirm issue resolved

── FINAL QC (every job) ──
- All installed systems tested and functional
- All wiring inspected — no exposed terminations
- All roof/exterior penetrations sealed
- Customer walkthrough complete — sign-off obtained

STRICT RULES (for anything not matched above):
- Parts/products not in guide: prefix "Install" + exact product name as written
- Labor lines: copy description verbatim, clean abbreviations only
- Never invent tasks not stated in the invoice
- Include quantities if listed (e.g. "Install Rich Solar 100Ah Battery x2")
- Retail/merch items (hats, stickers, tees, koozies, MODL tools): include as "Retail sale — [item name]" under a "Retail / Accessories" category, no install steps
- Admin items (CC fees, shipping, storage, tax, discounts): OMIT entirely
- Final QC appears ONCE only, at the end

GROUP into logical CATEGORIES and SUBCATEGORIES. Keep subcategories tight — combine related items rather than making a subcategory for every single line item.

Return ONLY valid JSON in this exact format, no explanation, no markdown:

  "categories": [
    {
      "cat": "Category Name",
      "subs": [
        {
          "name": "Subcategory Name",
          "items": ["Task item 1", "Task item 2"]
        }
      ]
    }
  ]
}

${invoiceText}`;

  try {
    const response = await fetch('https://tcg-proxy.justin-57c.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',

      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data?.error?.message || 'API error');
    const raw    = data.content?.find(b => b.type === 'text')?.text || '';
    const clean  = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    lastParsed = { customer, vehicle, tech, categories: parsed.categories, timestamp: Date.now() };
    renderJobCard(customer, vehicle, tech, parsed.categories);
    setStatus('Done — ready to send to job board.', 'done');
    document.getElementById('btn-push').disabled = false;
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message, 'error');
  }
  document.getElementById('btn-parse').disabled = false;
}

function renderJobCard(customer, vehicle, tech, categories) {
  document.getElementById('result-header-fields').innerHTML = `
    <div class="job-info-item"><div class="label">Customer</div><div class="value">${esc(customer)}</div></div>
    <div class="job-info-item"><div class="label">Vehicle</div><div class="value">${esc(vehicle)}</div></div>
    <div class="job-info-item"><div class="label">Tech</div><div class="value">${esc(tech)}</div></div>
  `;
  const body = document.getElementById('result-body');
  body.innerHTML = '';
  categories.forEach(section => {
    const catEl = document.createElement('div');
    catEl.className = 'category';
    catEl.innerHTML = `<div class="cat-title">${esc(section.cat)}</div>`;
    section.subs.forEach(sub => {
      const subEl = document.createElement('div');
      subEl.className = 'subcategory';
      subEl.innerHTML = `<div class="sub-title">${esc(sub.name)}</div>`;
      const ul = document.createElement('ul'); ul.className = 'items';
      sub.items.forEach(item => { const li = document.createElement('li'); li.textContent = item; ul.appendChild(li); });
      subEl.appendChild(ul); catEl.appendChild(subEl);
    });
    body.appendChild(catEl);
  });
  document.getElementById('result-empty').style.display = 'none';
  document.getElementById('result-wrap').style.display  = 'block';
}

function openSlotPicker() {
  if (!lastParsed) return;
  const slots = window._currentSlots || {};
  const grid  = document.getElementById('slot-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= 4; i++) {
    const btn = document.createElement('button'); btn.className = 'slot-btn';
    const existing = slots[`slot${i}`];
    const name = existing ? (existing.customer || 'Occupied') : 'Empty';
    if (existing) btn.classList.add('occupied');
    btn.innerHTML = `<span class="slot-num">Job ${i}</span><span class="slot-name">${name}</span>`;
    const n = i;
    btn.onclick = async () => {
      if (existing && !confirm(`Job ${n} already has "${name}". Replace it?`)) return;
      closeModal();
      setStatus('<span class="spinner"></span>Sending to job board...', 'loading');
      try {
        await window.pushJobToSlot(n, lastParsed);
        setStatus(`✓ Sent to Job ${n} on the board.`, 'done');
      } catch(e) { setStatus('Send failed: ' + e.message, 'error'); }
    };
    grid.appendChild(btn);
  }
  document.getElementById('slot-modal').classList.add('open');
}

function closeModal() { document.getElementById('slot-modal').classList.remove('open'); }

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.innerHTML = msg; el.className = 'status ' + (type || '');
}

function clearAll() {
  document.getElementById('invoice-input').value = '';
  ['f-customer','f-vehicle','f-tech'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('result-empty').style.display = 'block';
  document.getElementById('result-wrap').style.display  = 'none';
  document.getElementById('btn-push').disabled = true;
  lastParsed = null;
  setStatus('', '');
}
