<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Invoice Parser</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --border: #d0d0d0; --bg: #f7f6f3; --card-bg: #ffffff;
    --text: #1a1a1a; --muted: #999; --cat: #333; --subcat: #555; --item: #444; --accent: #1a1a1a;
  }

  /* ── Auth gate ── */
  #auth-gate {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: var(--bg);
  }
  .auth-box {
    background: white; border: 1.5px solid var(--border); border-radius: 6px;
    padding: 40px 36px; text-align: center; max-width: 340px; width: 100%;
  }
  .auth-box h1 { font-family: 'DM Mono', monospace; font-size: 1.1rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .auth-box p { font-size: 0.75rem; color: var(--muted); margin-bottom: 28px; font-family: 'DM Mono', monospace; letter-spacing: 0.04em; }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px 16px; border: 1.5px solid #ddd; border-radius: 4px; background: white; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500; color: #333; transition: background 0.15s; }
  .btn-google:hover { background: #f5f5f5; }
  .auth-error { margin-top: 14px; font-family: 'DM Mono', monospace; font-size: 0.68rem; color: #c00; display: none; }

  #app { display: none; }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 24px 20px 48px; min-height: 100vh; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-family: 'DM Mono', monospace; font-size: 1.5rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
  header .sub { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.05em; }
  .top-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; transition: background 0.3s; }
  .sync-dot.live { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .sync-dot.error { background: #e74c3c; }
  .sync-label { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.04em; }
  .user-info { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); }
  .btn-signout { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: 1px solid #ddd; border-radius: 3px; padding: 3px 10px; cursor: pointer; color: #888; }
  .btn-signout:hover { background: #f0f0f0; }

  .input-panel { max-width: 820px; margin: 0 auto 32px; background: white; border: 1.5px solid var(--border); border-radius: 4px; padding: 20px; }
  .input-panel h2 { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .fields-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .field-group input { border: 1px solid #e0e0e0; border-radius: 3px; padding: 6px 8px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; outline: none; color: var(--text); }
  .field-group input:focus { border-color: #999; }
  .field-group input::placeholder { color: #ccc; }

  textarea { width: 100%; min-height: 160px; border: 1px solid #e0e0e0; border-radius: 3px; padding: 10px; font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text); resize: vertical; outline: none; background: #fafafa; line-height: 1.6; }
  textarea:focus { border-color: #999; background: white; }
  textarea::placeholder { color: #ccc; }

  .parse-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .btn-primary { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 20px; border-radius: 3px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: white; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 16px; border-radius: 3px; cursor: pointer; border: 1px solid #ccc; background: white; color: #555; transition: background 0.15s; }
  .btn-secondary:hover { background: #f0f0f0; }
  .btn-green { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 20px; border-radius: 3px; cursor: pointer; border: 1px solid #27ae60; background: #27ae60; color: white; transition: opacity 0.15s; }
  .btn-green:hover { opacity: 0.85; }
  .btn-green:disabled { opacity: 0.4; cursor: not-allowed; }

  .status { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; }
  .status.loading { color: #888; }
  .status.error { color: #c00; }
  .status.done { color: #2a7a2a; }

  .result-area { max-width: 960px; margin: 0 auto; }
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .result-header h2 { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .result-actions { display: flex; gap: 8px; }
  .job-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; }
  .job-header { border-bottom: 1.5px solid var(--border); padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .job-info-item { display: flex; flex-direction: column; gap: 2px; }
  .job-info-item .label { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .job-info-item .value { font-size: 0.8rem; font-weight: 600; color: var(--text); }
  .job-body { padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .cat-title { font-family: 'DM Mono', monospace; font-size: 0.68rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cat); border-bottom: 1px solid #e8e8e8; padding-bottom: 3px; margin-bottom: 7px; }
  .subcategory { margin-bottom: 8px; padding-left: 2px; }
  .sub-title { font-size: 0.7rem; font-weight: 600; color: var(--subcat); margin-bottom: 4px; }
  .items { list-style: none; padding-left: 8px; }
  .items li { display: flex; align-items: flex-start; gap: 5px; font-size: 0.7rem; color: var(--item); line-height: 1.6; padding: 1px 0; }
  .items li::before { content: '–'; color: var(--muted); flex-shrink: 0; }

  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ddd; border-top-color: #555; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.06em; border: 1.5px dashed #e0e0e0; border-radius: 4px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 6px; padding: 24px; width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
  .modal h3 { font-family: 'DM Mono', monospace; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; color: var(--text); }
  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .slot-btn { font-family: 'DM Mono', monospace; font-size: 0.7rem; padding: 10px; border: 1.5px solid var(--border); border-radius: 4px; background: white; cursor: pointer; text-align: left; transition: border-color 0.15s; }
  .slot-btn:hover { border-color: #1a1a1a; background: #f5f5f5; }
  .slot-btn .slot-num { font-weight: 600; display: block; margin-bottom: 2px; }
  .slot-btn .slot-name { font-size: 0.62rem; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-btn.occupied { border-color: #e0c860; }
  .modal-cancel { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: 1px solid #ddd; border-radius: 3px; padding: 6px 14px; cursor: pointer; color: #888; }
  .modal-cancel:hover { background: #f5f5f5; }

  @media print {
    #auth-gate { display: none !important; }
    body { background: white; padding: 12px; }
    .input-panel { display: none; }
    .result-actions { display: none; }
    .result-header h2 { display: none; }
    .job-card { border: 1px solid #bbb; }
    @page { size: landscape; margin: 0.4in; }
  }
</style>
</head>
<body>

<!-- ── Auth gate ── -->
<div id="auth-gate">
  <div class="auth-box">
    <h1>TCG Invoice Parser</h1>
    <p>Sign in with your TCG Google account</p>
    <button class="btn-google" id="btn-google-signin">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error">Access denied. Use your TCG email address.</div>
  </div>
</div>

<!-- ── Main app ── -->
<div id="app">
  <header>
    <h1>TCG Invoice Parser</h1>
    <div class="sub">Paste a QuickBooks invoice → push to job board</div>
    <div class="top-bar">
      <span class="sync-dot" id="sync-dot"></span>
      <span class="sync-label" id="sync-label">connecting...</span>
      <span class="user-info" id="user-info"></span>
      <button class="btn-signout" id="btn-signout">Sign Out</button>
    </div>
  </header>

  <div class="input-panel">
    <h2>Job Info</h2>
    <div class="fields-row">
      <div class="field-group"><label>Customer Name</label><input id="f-customer" placeholder="e.g. John Smith" autocomplete="off"></div>
      <div class="field-group"><label>Vehicle</label><input id="f-vehicle" placeholder="e.g. 2022 Ford F-250" autocomplete="off"></div>
      <div class="field-group"><label>Tech</label><input id="f-tech" placeholder="Initials" autocomplete="off"></div>
    </div>
    <h2 style="margin-bottom:12px;">Invoice Line Items</h2>
    <textarea id="invoice-input" placeholder="Paste your QuickBooks invoice line items here...

Example:
Victron SmartSolar MPPT 100/30
Battle Born 100Ah LiFePO4 Battery x2
Renogy 200W Solar Panel x2
Victron BMV-712 Battery Monitor
Blue Sea 5029 ST Blade Fuse Block
2/0 AWG Welding Cable - Red 6ft
Install labor - solar system
Roof penetration glands x4
Wire loom and conduit
Shore power inlet install"></textarea>
    <div class="parse-row">
      <button class="btn-primary" id="btn-parse" onclick="parseInvoice()">Generate Job Card</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
      <button class="btn-green" id="btn-push" onclick="openSlotPicker()" disabled>Send to Job Board →</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="result-area">
    <div id="result-empty" class="empty-state">Generated job card will appear here</div>
    <div id="result-wrap" style="display:none;">
      <div class="result-header">
        <h2>Generated Job Card</h2>
        <div class="result-actions"><button class="btn-secondary" onclick="window.print()">Print</button></div>
      </div>
      <div class="job-card">
        <div class="job-header" id="result-header-fields"></div>
        <div class="job-body" id="result-body"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="slot-modal">
  <div class="modal">
    <h3>Send to which job slot?</h3>
    <div class="slot-grid" id="slot-grid"></div>
    <button class="modal-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp }                              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue }             from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged }
                                                      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCJpAsk_zRsssznO0_c2QxSpB7BJykULKY",
  authDomain:        "tcg-jobs.firebaseapp.com",
  databaseURL:       "https://tcg-jobs-default-rtdb.firebaseio.com",
  projectId:         "tcg-jobs",
  storageBucket:     "tcg-jobs.firebasestorage.app",
  messagingSenderId: "275203550533",
  appId:             "1:275203550533:web:bf497f86eee41a7048622c"
};

const ALLOWED_EMAILS = [
  "justin@truckcampergarage.com",
  "ryan@truckcampergarage.com",
  "john@truckcampergarage.com",
  "zach@truckcampergarage.com",
  "sacha@truckcampergarage.com",
  "sam@truckcampergarage.com"
];

const app      = initializeApp(firebaseConfig);
const db       = getDatabase(app);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, (user) => {
  if (user && ALLOWED_EMAILS.includes(user.email)) {
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-info').textContent = user.email;
    document.getElementById('auth-error').style.display = 'none';
    startListening();
  } else if (user) {
    fbSignOut(auth);
    document.getElementById('auth-error').style.display = 'block';
    document.getElementById('auth-gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  } else {
    document.getElementById('auth-gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

document.getElementById('btn-google-signin').addEventListener('click', async () => {
  try { await signInWithPopup(auth, provider); } catch(e) { console.error(e); }
});
document.getElementById('btn-signout').addEventListener('click', () => { fbSignOut(auth); });

const currentSlots = {};

function startListening() {
  onValue(ref(db, 'jobs'), (snapshot) => {
    const data = snapshot.val() || {};
    Object.assign(currentSlots, data);
    // Clear slots that were removed
    for (let i = 1; i <= 4; i++) {
      if (!data[`slot${i}`]) delete currentSlots[`slot${i}`];
    }
    setSyncStatus(true);
  }, () => setSyncStatus(false));
}

function setSyncStatus(ok) {
  document.getElementById('sync-dot').className     = 'sync-dot ' + (ok ? 'live' : 'error');
  document.getElementById('sync-label').textContent = ok ? 'connected to job board' : 'disconnected';
}

window.pushJobToSlot = async function(slotNum, jobData) {
  await set(ref(db, `jobs/slot${slotNum}`), jobData);
};

window._currentSlots = currentSlots;
</script>

<script>
let lastParsed = null;

async function parseInvoice() {
  const invoiceText = document.getElementById('invoice-input').value.trim();
  if (!invoiceText) { setStatus('Paste some invoice line items first.', 'error'); return; }

  const customer = document.getElementById('f-customer').value.trim() || 'N/A';
  const vehicle  = document.getElementById('f-vehicle').value.trim()  || 'N/A';
  const tech     = document.getElementById('f-tech').value.trim()     || 'N/A';

  setStatus('<span class="spinner"></span>Parsing invoice...', 'loading');
  document.getElementById('btn-parse').disabled = true;
  document.getElementById('btn-push').disabled  = true;

  const prompt = `You are a truck camper and overlanding shop assistant.
Given the following QuickBooks invoice line items, organize them into a job task card.

Group the items into logical CATEGORIES (e.g. Solar Install, Electrical, Mechanical, Water & HVAC, Final QC, etc.) and SUBCATEGORIES within each (e.g. Panels & Mounting, Battery Bank, Wiring, etc.).

For each item, write a short task-oriented action phrase (e.g. "Install Victron MPPT 100/30" not just "Victron MPPT 100/30"). Include quantities if relevant.

Return ONLY valid JSON in this exact format, no explanation, no markdown:
{
  "categories": [
    {
      "cat": "Category Name",
      "subs": [
        {
          "name": "Subcategory Name",
          "items": ["Task item 1", "Task item 2"]
        }
      ]
    }
  ]
}

Invoice line items:
${invoiceText}`;

  try {
    const response = await fetch('https://tcg-proxy.justin-57c.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 4000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data?.error?.message || 'API error');
    const raw    = data.content?.find(b => b.type === 'text')?.text || '';
    const clean  = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    lastParsed = { customer, vehicle, tech, categories: parsed.categories, timestamp: Date.now() };
    renderJobCard(customer, vehicle, tech, parsed.categories);
    setStatus('Done — ready to send to job board.', 'done');
    document.getElementById('btn-push').disabled = false;
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message, 'error');
  }
  document.getElementById('btn-parse').disabled = false;
}

function renderJobCard(customer, vehicle, tech, categories) {
  document.getElementById('result-header-fields').innerHTML = `
    <div class="job-info-item"><div class="label">Customer</div><div class="value">${esc(customer)}</div></div>
    <div class="job-info-item"><div class="label">Vehicle</div><div class="value">${esc(vehicle)}</div></div>
    <div class="job-info-item"><div class="label">Tech</div><div class="value">${esc(tech)}</div></div>
  `;
  const body = document.getElementById('result-body');
  body.innerHTML = '';
  categories.forEach(section => {
    const catEl = document.createElement('div');
    catEl.className = 'category';
    catEl.innerHTML = `<div class="cat-title">${esc(section.cat)}</div>`;
    section.subs.forEach(sub => {
      const subEl = document.createElement('div');
      subEl.className = 'subcategory';
      subEl.innerHTML = `<div class="sub-title">${esc(sub.name)}</div>`;
      const ul = document.createElement('ul'); ul.className = 'items';
      sub.items.forEach(item => { const li = document.createElement('li'); li.textContent = item; ul.appendChild(li); });
      subEl.appendChild(ul); catEl.appendChild(subEl);
    });
    body.appendChild(catEl);
  });
  document.getElementById('result-empty').style.display = 'none';
  document.getElementById('result-wrap').style.display  = 'block';
}

function openSlotPicker() {
  if (!lastParsed) return;
  const slots = window._currentSlots || {};
  const grid  = document.getElementById('slot-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= 4; i++) {
    const btn = document.createElement('button'); btn.className = 'slot-btn';
    const existing = slots[`slot${i}`];
    const name = existing ? (existing.customer || 'Occupied') : 'Empty';
    if (existing) btn.classList.add('occupied');
    btn.innerHTML = `<span class="slot-num">Job ${i}</span><span class="slot-name">${name}</span>`;
    const n = i;
    btn.onclick = async () => {
      if (existing && !confirm(`Job ${n} already has "${name}". Replace it?`)) return;
      closeModal();
      setStatus('<span class="spinner"></span>Sending to job board...', 'loading');
      try {
        await window.pushJobToSlot(n, lastParsed);
        setStatus(`✓ Sent to Job ${n} on the board.`, 'done');
      } catch(e) { setStatus('Send failed: ' + e.message, 'error'); }
    };
    grid.appendChild(btn);
  }
  document.getElementById('slot-modal').classList.add('open');
}

function closeModal() { document.getElementById('slot-modal').classList.remove('open'); }

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.innerHTML = msg; el.className = 'status ' + (type || '');
}

function clearAll() {
  document.getElementById('invoice-input').value = '';
  ['f-customer','f-vehicle','f-tech'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('result-empty').style.display = 'block';
  document.getElementById('result-wrap').style.display  = 'none';
  document.getElementById('btn-push').disabled = true;
  lastParsed = null;
  setStatus('', '');
}
</script>
</body>
</html>
